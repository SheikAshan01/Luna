<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0e1e38" />
      <stop offset="100%" stop-color="#02040a" />
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00f5ff" stop-opacity="1" />
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </radialGradient>
    <filter id="neon" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="url(#glow)" opacity="0.4" />
  <circle cx="256" cy="256" r="190" stroke="#00f5ff" stroke-width="4" stroke-opacity="0.7" fill="none" filter="url(#neon)" />
  <circle cx="256" cy="256" r="160" stroke="#a855f7" stroke-width="6" stroke-opacity="0.8" stroke-dasharray="16 12" fill="none" />
  <circle cx="256" cy="256" r="110" fill="url(#core)" filter="url(#neon)" />
  <circle cx="256" cy="256" r="50" fill="#ffffff" opacity="0.9" />
</svg>
